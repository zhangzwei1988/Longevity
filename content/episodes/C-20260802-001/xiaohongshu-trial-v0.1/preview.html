<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小红书图文预览</title><style>
    body{margin:0;padding:28px;background:#e9e6de;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#252821}
    main{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:24px;max-width:1500px;margin:auto}
    figure{margin:0;background:white;padding:10px;box-shadow:0 6px 24px rgba(37,40,33,.12)}img{display:block;width:100%;height:auto}figcaption{padding:8px 2px 0;font-size:13px;color:#6d716a}
    </style></head><body><main><figure><img src="source/01-cover.svg" alt="夜晚的家中，一只手停在手机上方，桌面放着笔和空白笔记本。"><figcaption>01</figcaption></figure>
<figure><img src="source/02-pause-before-paying.svg" alt="深夜桌边的手机、手和笔记本，表现付款前停下来核对信息的时刻。"><figcaption>02</figcaption></figure>
<figure><img src="source/03-four-questions.svg" alt="四张略微错落的纸卡，分别写着承诺、证据、验收和责任。"><figcaption>03</figcaption></figure>
<figure><img src="source/04-promise.svg" alt="第一页问题卡，列出核对健康项目具体交付的四个问题。"><figcaption>04</figcaption></figure>
<figure><img src="source/05-evidence.svg" alt="第二页问题卡，提醒读者核对研究与眼前产品、用法、人群和结果的关系。"><figcaption>05</figcaption></figure>
<figure><img src="source/06-acceptance-mismatch.svg" alt="两张错落的对话气泡，表现消费者感受与服务完成记录之间的验收错位。"><figcaption>06</figcaption></figure>
<figure><img src="source/07-responsibility.svg" alt="桌面上的空白协议、收据、手机和笔记本，旁边列出责任与健康资料问题。"><figcaption>07</figcaption></figure>
<figure><img src="source/08-save-card.svg" alt="一张可收藏的付款前四问清单，包含承诺、证据、验收和责任。"><figcaption>08</figcaption></figure>
<figure><img src="source/09-closing.svg" alt="圆形纸张中的收尾文字，提醒付款前先弄清自己购买的具体内容。"><figcaption>09</figcaption></figure></main></body></html>
