    <text x="78" y="170" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="65" font-weight="750" fill="#252821" opacity="1.0"><tspan x="78" dy="0">最尴尬的错位，</tspan><tspan x="78" dy="83">常常发生在几个月后</tspan></text><g transform="rotate(-1.3 380 520)"><rect x="90" y="340" width="700" height="300" rx="34" fill="#FFFFFF" stroke="#252821" stroke-width="2"/><text x="145" y="445" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="45" font-weight="600" fill="#252821" opacity="1.0"><tspan x="145" dy="0">你说：</tspan><tspan x="145" dy="60">“好像没什么感觉。”</tspan></text></g><g transform="rotate(1.6 690 860)"><rect x="290" y="700" width="700" height="300" rx="34" fill="#B7F34A" stroke="#252821" stroke-width="2"/><text x="345" y="805" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="45" font-weight="650" fill="#252821" opacity="1.0"><tspan x="345" dy="0">对方说：</tspan><tspan x="345" dy="60">“十二次一次没少，</tspan><tspan x="345" dy="60">我们全做完了。”</tspan></text></g><text x="540" y="1180" text-anchor="middle" font-family="HanziPen SC, Kaiti SC, cursive" font-size="42" font-weight="730" fill="#28634B" opacity="1.0"><tspan x="540" dy="0">两边可能都没撒谎，只是从没说清怎样才算“做到”。</tspan></text>
      <text x="68" y="1390" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="650" fill="#6D716A">多活十年 Lab</text>
