    <circle cx="540" cy="610" r="420" fill="#B7F34A" opacity="0.36"/><circle cx="540" cy="610" r="342" fill="#FFF9EF" stroke="#252821" stroke-width="3"/><text x="540" y="455" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="62" font-weight="760" fill="#252821" opacity="1.0"><tspan x="540" dy="0">有些钱</tspan><tspan x="540" dy="77">不是不能花。</tspan><tspan x="540" dy="77">怕的是花完以后，</tspan><tspan x="540" dy="77">连自己买了什么</tspan><tspan x="540" dy="77">都说不清。</tspan></text><text x="540" y="885" text-anchor="middle" font-family="HanziPen SC, Kaiti SC, cursive" font-size="32" font-weight="500" fill="#28634B" opacity="1.0"><tspan x="540" dy="0">今晚不买，通常不会立刻失去未来十年的健康。</tspan></text><rect x="95" y="1120" width="890" height="110" rx="55" fill="#252821"/><text x="540" y="1190" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="31" font-weight="600" fill="#FFF9EF" opacity="1.0"><tspan x="540" dy="0">你最难问清的是：承诺、证据、验收，还是责任？</tspan></text><text x="540" y="1325" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="23" font-weight="430" fill="#6D716A" opacity="1.0"><tspan x="540" dy="0">本图文提供一般信息整理框架，不判断具体项目疗效、医学适用性或个案法律争议。</tspan></text>
      <text x="68" y="1390" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="650" fill="#6D716A">多活十年 Lab</text>
