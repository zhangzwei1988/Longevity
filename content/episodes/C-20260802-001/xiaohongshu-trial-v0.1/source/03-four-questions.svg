    <text x="78" y="155" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="68" font-weight="750" fill="#252821" opacity="1.0"><tspan x="78" dy="0">值不值，先对上 4 件事</tspan></text><text x="82" y="283" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="31" font-weight="430" fill="#6D716A" opacity="1.0"><tspan x="82" dy="0">这是一套付款前的信息核对框架，不是疗效判断清单。</tspan></text><g transform="rotate(-1.6 289 630)"><rect x="74" y="480" width="430" height="300" rx="18" fill="#B7F34A" stroke="#252821" stroke-opacity="0.22" stroke-width="2"/><circle cx="124" cy="528" r="25" fill="#28634B"/><text x="124" y="537" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="750" fill="#FFFFFF" opacity="1.0"><tspan x="124" dy="0">01</tspan></text><text x="110" y="600" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="45" font-weight="730" fill="#252821" opacity="1.0"><tspan x="110" dy="0">承诺</tspan></text><text x="112" y="682" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" font-weight="430" fill="#6D716A" opacity="1.0"><tspan x="112" dy="0">卖给你的到底是什么</tspan></text></g><g transform="rotate(1.2 767 605)"><rect x="552" y="455" width="430" height="300" rx="18" fill="#FFFFFF" stroke="#252821" stroke-opacity="0.22" stroke-width="2"/><circle cx="602" cy="503" r="25" fill="#28634B"/><text x="602" y="512" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="750" fill="#FFFFFF" opacity="1.0"><tspan x="602" dy="0">02</tspan></text><text x="588" y="575" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="45" font-weight="730" fill="#252821" opacity="1.0"><tspan x="588" dy="0">证据</tspan></text><text x="590" y="657" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" font-weight="430" fill="#6D716A" opacity="1.0"><tspan x="590" dy="0">依据真正支持什么</tspan></text></g><g transform="rotate(1.0 309 1008)"><rect x="94" y="858" width="430" height="300" rx="18" fill="#FFFFFF" stroke="#252821" stroke-opacity="0.22" stroke-width="2"/><circle cx="144" cy="906" r="25" fill="#28634B"/><text x="144" y="915" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="750" fill="#FFFFFF" opacity="1.0"><tspan x="144" dy="0">03</tspan></text><text x="130" y="978" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="45" font-weight="730" fill="#252821" opacity="1.0"><tspan x="130" dy="0">验收</tspan></text><text x="132" y="1060" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" font-weight="430" fill="#6D716A" opacity="1.0"><tspan x="132" dy="0">怎样才算真正做到</tspan></text></g><g transform="rotate(-1.2 787 982)"><rect x="572" y="832" width="430" height="300" rx="18" fill="#F8E7E3" stroke="#252821" stroke-opacity="0.22" stroke-width="2"/><circle cx="622" cy="880" r="25" fill="#C74638"/><text x="622" y="889" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="750" fill="#FFFFFF" opacity="1.0"><tspan x="622" dy="0">04</tspan></text><text x="608" y="952" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="45" font-weight="730" fill="#252821" opacity="1.0"><tspan x="608" dy="0">责任</tspan></text><text x="610" y="1034" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" font-weight="430" fill="#6D716A" opacity="1.0"><tspan x="610" dy="0">出问题到底找谁</tspan></text></g>
