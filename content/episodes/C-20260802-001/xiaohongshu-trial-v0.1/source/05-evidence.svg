    <text x="82" y="185" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="132" font-weight="800" fill="#C74638" opacity="0.18">02</text><text x="80" y="235" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="72" font-weight="750" fill="#252821" opacity="1.0"><tspan x="80" dy="0">别只问：</tspan><tspan x="80" dy="83">“有没有论文？”</tspan></text><text x="84" y="531" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="36" font-weight="430" fill="#252821" opacity="1.0"><tspan x="84" dy="0">真正该问的是：这份依据证明了什么，和我准备买的东西</tspan><tspan x="84" dy="54">有什么关系？</tspan></text><circle cx="110" cy="704" r="10" fill="#B7F34A" stroke="#252821" stroke-width="2"/><text x="145" y="714" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="31" font-weight="520" fill="#252821" opacity="1.0"><tspan x="145" dy="0">研究的是眼前这个产品或服务吗</tspan></text><circle cx="110" cy="778" r="10" fill="#B7F34A" stroke="#252821" stroke-width="2"/><text x="145" y="788" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="31" font-weight="520" fill="#252821" opacity="1.0"><tspan x="145" dy="0">使用方法和研究里一样吗</tspan></text><circle cx="110" cy="852" r="10" fill="#B7F34A" stroke="#252821" stroke-width="2"/><text x="145" y="862" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="31" font-weight="520" fill="#252821" opacity="1.0"><tspan x="145" dy="0">研究对象和我是一类人吗</tspan></text><circle cx="110" cy="926" r="10" fill="#B7F34A" stroke="#252821" stroke-width="2"/><text x="145" y="936" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="31" font-weight="520" fill="#252821" opacity="1.0"><tspan x="145" dy="0">它说明的是数字变化，还是实际结果</tspan></text><line x1="78" y1="1242" x2="1000" y2="1242" stroke="#6D716A" stroke-width="2" stroke-dasharray="8 10" opacity="0.5"/><text x="82" y="1290" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="24" font-weight="430" fill="#6D716A" opacity="1.0"><tspan x="82" dy="0">涉及检查、治疗、康复或器械用途，请找独立、具备相应资质的专业人员确认。</tspan></text>
