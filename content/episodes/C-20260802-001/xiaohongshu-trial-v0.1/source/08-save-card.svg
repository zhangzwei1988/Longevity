    <rect x="65" y="65" width="950" height="1288" rx="20" fill="#FFFFFF" stroke="#252821" stroke-width="3"/><rect x="65" y="65" width="950" height="142" fill="#B7F34A"/><text x="110" y="158" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="64" font-weight="760" fill="#252821" opacity="1.0"><tspan x="110" dy="0">付款前四问卡</tspan></text><rect x="112" y="291" width="50" height="50" rx="6" fill="#FFF9EF" stroke="#28634B" stroke-width="4"/><text x="137" y="328" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="750" fill="#28634B" opacity="1.0"><tspan x="137" dy="0">1</tspan></text><text x="200" y="325" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="40" font-weight="700" fill="#252821" opacity="1.0"><tspan x="200" dy="0">承诺</tspan></text><text x="202" y="415" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" font-weight="430" fill="#6D716A" opacity="1.0"><tspan x="202" dy="0">我到底买到了什么？</tspan></text><rect x="112" y="496" width="50" height="50" rx="6" fill="#FFF9EF" stroke="#28634B" stroke-width="4"/><text x="137" y="533" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="750" fill="#28634B" opacity="1.0"><tspan x="137" dy="0">2</tspan></text><text x="200" y="530" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="40" font-weight="700" fill="#252821" opacity="1.0"><tspan x="200" dy="0">证据</tspan></text><text x="202" y="620" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" font-weight="430" fill="#6D716A" opacity="1.0"><tspan x="202" dy="0">依据支持什么，限制是什么？</tspan></text><rect x="112" y="701" width="50" height="50" rx="6" fill="#FFF9EF" stroke="#28634B" stroke-width="4"/><text x="137" y="738" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="750" fill="#28634B" opacity="1.0"><tspan x="137" dy="0">3</tspan></text><text x="200" y="735" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="40" font-weight="700" fill="#252821" opacity="1.0"><tspan x="200" dy="0">验收</tspan></text><text x="202" y="825" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" font-weight="430" fill="#6D716A" opacity="1.0"><tspan x="202" dy="0">怎样才算做到，由谁记录？</tspan></text><rect x="112" y="906" width="50" height="50" rx="6" fill="#FFF9EF" stroke="#28634B" stroke-width="4"/><text x="137" y="943" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="750" fill="#28634B" opacity="1.0"><tspan x="137" dy="0">4</tspan></text><text x="200" y="940" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="40" font-weight="700" fill="#252821" opacity="1.0"><tspan x="200" dy="0">责任</tspan></text><text x="202" y="1030" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" font-weight="430" fill="#6D716A" opacity="1.0"><tspan x="202" dy="0">谁收钱、谁服务、出问题找谁？</tspan></text><rect x="105" y="1192" width="870" height="116" rx="12" fill="#F8E7E3"/><text x="540" y="1250" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" font-weight="550" fill="#252821" opacity="1.0"><tspan x="540" dy="0">请对方用合同、说明书或正式材料回答；说清楚不等于一定该买，答不</tspan><tspan x="540" dy="35">出也不等于当场违法。</tspan></text>
