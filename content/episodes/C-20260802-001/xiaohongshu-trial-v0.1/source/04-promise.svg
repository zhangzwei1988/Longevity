    <text x="82" y="185" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="132" font-weight="800" fill="#C74638" opacity="0.18">01</text><text x="80" y="235" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="72" font-weight="750" fill="#252821" opacity="1.0"><tspan x="80" dy="0">卖给你的，</tspan><tspan x="80" dy="83">到底是什么？</tspan></text><text x="84" y="531" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="36" font-weight="430" fill="#252821" opacity="1.0"><tspan x="84" dy="0">“改善状态”很好听，问题是它到底指什么。把口头形容</tspan><tspan x="84" dy="54">词变成能核对的交付。</tspan></text><circle cx="110" cy="704" r="10" fill="#B7F34A" stroke="#252821" stroke-width="2"/><text x="145" y="714" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="31" font-weight="520" fill="#252821" opacity="1.0"><tspan x="145" dy="0">最后交付什么</tspan></text><circle cx="110" cy="778" r="10" fill="#B7F34A" stroke="#252821" stroke-width="2"/><text x="145" y="788" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="31" font-weight="520" fill="#252821" opacity="1.0"><tspan x="145" dy="0">由谁解释或提供服务</tspan></text><circle cx="110" cy="852" r="10" fill="#B7F34A" stroke="#252821" stroke-width="2"/><text x="145" y="862" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="31" font-weight="520" fill="#252821" opacity="1.0"><tspan x="145" dy="0">一共几次、持续多久</tspan></text><circle cx="110" cy="926" r="10" fill="#B7F34A" stroke="#252821" stroke-width="2"/><text x="145" y="936" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="31" font-weight="520" fill="#252821" opacity="1.0"><tspan x="145" dy="0">哪些问题它回答不了</tspan></text><line x1="78" y1="1242" x2="1000" y2="1242" stroke="#6D716A" stroke-width="2" stroke-dasharray="8 10" opacity="0.5"/><text x="82" y="1290" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="24" font-weight="430" fill="#6D716A" opacity="1.0"><tspan x="82" dy="0">价格高不等于没有价值；价格低也不等于值得。</tspan></text>
      <text x="68" y="1390" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="650" fill="#6D716A">多活十年 Lab</text>
      <text x="1012" y="1390" text-anchor="end" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="650" fill="#6D716A">04/09</text>
    
