    <circle cx="930" cy="155" r="120" fill="#F9E1D2"/><text x="76" y="176" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="68" font-weight="760" fill="#152B24" opacity="1.0"><tspan x="76" dy="0">销售催你确认时，</tspan><tspan x="76" dy="76">把这句话发过去</tspan></text><path d="M76 357 Q378 348 680 349" stroke="#E86F3E" stroke-width="13" fill="none" stroke-linecap="round"/><g transform="rotate(-1.2 540 720)"><rect x="98" y="430" width="884" height="600" rx="30" fill="#FFFFFF" stroke="#C7C8BE" stroke-width="3"/><circle cx="158" cy="502" r="28" fill="#1E493C"/><text x="202" y="514" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="28" font-weight="650" fill="#1E493C" opacity="1.0"><tspan x="202" dy="0">直接复制发给对方</tspan></text><text x="158" y="620" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="43" font-weight="630" fill="#152B24" opacity="1.0"><tspan x="158" dy="0">我先不问优惠。</tspan><tspan x="158" dy="62">请把具体交付、证据范围、</tspan><tspan x="158" dy="62">验收方式和责任主体发我。</tspan></text><text x="158" y="896" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="29" font-weight="450" fill="#56665F" opacity="1.0"><tspan x="158" dy="0">最好用合同、说明书或正式材料回答。口头说得很顺，不等于</tspan><tspan x="158" dy="40">纸上已经写清。</tspan></text></g><rect x="120" y="1120" width="840" height="118" rx="10" fill="#DFE9DF"/><text x="540" y="1187" text-anchor="middle" font-family="HanziPen SC, Kaiti SC, cursive" font-size="31" font-weight="680" fill="#1E493C" opacity="1.0"><tspan x="540" dy="0">先把问题问清，再决定买不买。</tspan></text>
      <text x="68" y="1390" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="650" fill="#56665F">多活十年 Lab</text>
