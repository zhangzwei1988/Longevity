<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
    
    <defs>
      <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.4" fill="#152B24" opacity="0.045"/>
      </pattern>
    </defs>
    <rect width="1080" height="1440" fill="#F5F1E8"/>
    <rect width="1080" height="1440" fill="url(#dots)"/>
    <rect x="0" y="0" width="1080" height="18" fill="#ADC3B5"/><text x="72" y="116" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="62" font-weight="760" fill="#152B24" opacity="1.0"><tspan x="72" dy="0">健康功课单</tspan></text><text x="74" y="166" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="29" font-weight="500" fill="#56665F" opacity="1.0"><tspan x="74" dy="0">付款前四问｜这张先存下</tspan></text><line x1="72" y1="194" x2="1008" y2="194" stroke="#C7C8BE" stroke-width="3"/><rect x="72" y="238" width="19" height="38" rx="5" fill="#56665F"/><text x="112" y="264" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26" font-weight="620" fill="#56665F" opacity="1.0"><tspan x="112" dy="0">这次要拆的问题</tspan></text><text x="112" y="318" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="32" font-weight="520" fill="#152B24" opacity="1.0"><tspan x="112" dy="0">健康项目，值几万块吗？</tspan></text><line x1="110" y1="376" x2="1008" y2="376" stroke="#C7C8BE" stroke-width="2"/><rect x="72" y="376" width="19" height="38" rx="5" fill="#E86F3E"/><text x="112" y="402" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26" font-weight="620" fill="#E86F3E" opacity="1.0"><tspan x="112" dy="0">值不值得信</tspan></text><text x="112" y="456" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="32" font-weight="520" fill="#152B24" opacity="1.0"><tspan x="112" dy="0">承诺分别由什么证据支持，适用于谁，还有哪些限制？</tspan></text><line x1="110" y1="514" x2="1008" y2="514" stroke="#C7C8BE" stroke-width="2"/><rect x="72" y="514" width="19" height="38" rx="5" fill="#56665F"/><text x="112" y="540" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26" font-weight="620" fill="#56665F" opacity="1.0"><tspan x="112" dy="0">值不值得做</tspan></text><text x="112" y="594" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="32" font-weight="520" fill="#152B24" opacity="1.0"><tspan x="112" dy="0">它交付的是检测、设备、服务，还是可验收的健康结果？</tspan></text><line x1="110" y1="652" x2="1008" y2="652" stroke="#C7C8BE" stroke-width="2"/><rect x="72" y="652" width="19" height="38" rx="5" fill="#E86F3E"/><text x="112" y="678" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26" font-weight="620" fill="#E86F3E" opacity="1.0"><tspan x="112" dy="0">值不值得花钱</tspan></text><text x="112" y="732" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="32" font-weight="520" fill="#152B24" opacity="1.0"><tspan x="112" dy="0">目标、记录、复盘、退出和退款条件是否已经写清？</tspan></text><line x1="110" y1="790" x2="1008" y2="790" stroke="#C7C8BE" stroke-width="2"/><rect x="72" y="790" width="19" height="38" rx="5" fill="#56665F"/><text x="112" y="816" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26" font-weight="620" fill="#56665F" opacity="1.0"><tspan x="112" dy="0">证据到哪一步</tspan></text><text x="112" y="870" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="32" font-weight="520" fill="#152B24" opacity="1.0"><tspan x="112" dy="0">案例和论文不能自动证明眼前项目适合每个人。</tspan></text><line x1="110" y1="928" x2="1008" y2="928" stroke="#C7C8BE" stroke-width="2"/><rect x="72" y="928" width="19" height="38" rx="5" fill="#1E493C"/><text x="112" y="954" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26" font-weight="620" fill="#1E493C" opacity="1.0"><tspan x="112" dy="0">今天能做的一件事</tspan></text><text x="112" y="1008" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="32" font-weight="520" fill="#152B24" opacity="1.0"><tspan x="112" dy="0">把四问发过去：买什么、凭什么、怎么算做到、出了问题找谁。</tspan></text><path d="M108 1066 Q519 1057 930 1062" stroke="#ADC3B5" stroke-width="12" fill="none" stroke-linecap="round"/><text x="74" y="1098" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="430" fill="#56665F" opacity="1.0"><tspan x="74" dy="0">涉及检查、治疗、康复或器械用途，应向独立合格专业人员确认。</tspan></text>
      <text x="68" y="1390" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="650" fill="#56665F">多活十年 Lab</text>
      <text x="1012" y="1390" text-anchor="end" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="650" fill="#56665F">02/09</text>
    
        <g><rect x="760" y="26" width="292" height="52" rx="26" fill="#E86F3E" opacity="0.94"/>
        <text x="906" y="61" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">设计试稿 · 不可发布</text></g>
        </svg>