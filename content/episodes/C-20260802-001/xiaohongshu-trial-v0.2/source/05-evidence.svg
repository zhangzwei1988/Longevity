    <text x="82" y="185" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="132" font-weight="800" fill="#E86F3E" opacity="0.18">02</text><text x="80" y="235" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="72" font-weight="750" fill="#152B24" opacity="1.0"><tspan x="80" dy="0">论文封面一闪，</tspan><tspan x="80" dy="83">结论还在路上</tspan></text><text x="84" y="531" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="36" font-weight="430" fill="#152B24" opacity="1.0"><tspan x="84" dy="0">别只问“有没有论文”。真正要问的是，这份依据和我准</tspan><tspan x="84" dy="54">备买的东西到底有什么关系。</tspan></text><circle cx="110" cy="704" r="10" fill="#ADC3B5" stroke="#1E493C" stroke-width="2"/><text x="145" y="714" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="31" font-weight="520" fill="#152B24" opacity="1.0"><tspan x="145" dy="0">研究的是眼前这个产品或服务吗</tspan></text><circle cx="110" cy="778" r="10" fill="#ADC3B5" stroke="#1E493C" stroke-width="2"/><text x="145" y="788" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="31" font-weight="520" fill="#152B24" opacity="1.0"><tspan x="145" dy="0">用法和研究里一样吗</tspan></text><circle cx="110" cy="852" r="10" fill="#ADC3B5" stroke="#1E493C" stroke-width="2"/><text x="145" y="862" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="31" font-weight="520" fill="#152B24" opacity="1.0"><tspan x="145" dy="0">研究对象和我是一类人吗</tspan></text><circle cx="110" cy="926" r="10" fill="#ADC3B5" stroke="#1E493C" stroke-width="2"/><text x="145" y="936" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="31" font-weight="520" fill="#152B24" opacity="1.0"><tspan x="145" dy="0">数字变化等于实际结果改善吗</tspan></text><line x1="78" y1="1242" x2="1000" y2="1242" stroke="#56665F" stroke-width="2" stroke-dasharray="8 10" opacity="0.5"/><text x="82" y="1290" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="24" font-weight="430" fill="#56665F" opacity="1.0"><tspan x="82" dy="0">具体医学用途与个人适用性，应由独立合格专业人员确认。</tspan></text>
      <text x="68" y="1390" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="650" fill="#56665F">多活十年 Lab</text>
