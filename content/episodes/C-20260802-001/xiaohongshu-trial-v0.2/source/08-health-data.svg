    <rect x="65" y="65" width="950" height="1288" rx="20" fill="#FFFFFF" stroke="#152B24" stroke-width="3"/><rect x="65" y="65" width="950" height="142" fill="#1E493C"/><text x="110" y="158" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="64" font-weight="760" fill="#F5F1E8" opacity="1.0"><tspan x="110" dy="0">还要交体检报告？这 4 句别漏</tspan></text><rect x="112" y="291" width="50" height="50" rx="6" fill="#F5F1E8" stroke="#1E493C" stroke-width="4"/><text x="137" y="328" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="750" fill="#1E493C" opacity="1.0"><tspan x="137" dy="0">1</tspan></text><text x="200" y="325" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="40" font-weight="700" fill="#152B24" opacity="1.0"><tspan x="200" dy="0">为什么要</tspan></text><text x="202" y="415" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" font-weight="430" fill="#56665F" opacity="1.0"><tspan x="202" dy="0">这些健康资料具体用来做什么？</tspan></text><rect x="112" y="496" width="50" height="50" rx="6" fill="#F5F1E8" stroke="#1E493C" stroke-width="4"/><text x="137" y="533" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="750" fill="#1E493C" opacity="1.0"><tspan x="137" dy="0">2</tspan></text><text x="200" y="530" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="40" font-weight="700" fill="#152B24" opacity="1.0"><tspan x="200" dy="0">存多久</tspan></text><text x="202" y="620" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" font-weight="430" fill="#56665F" opacity="1.0"><tspan x="202" dy="0">服务结束后还会保留多久？</tspan></text><rect x="112" y="701" width="50" height="50" rx="6" fill="#F5F1E8" stroke="#1E493C" stroke-width="4"/><text x="137" y="738" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="750" fill="#1E493C" opacity="1.0"><tspan x="137" dy="0">3</tspan></text><text x="200" y="735" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="40" font-weight="700" fill="#152B24" opacity="1.0"><tspan x="200" dy="0">给谁看</tspan></text><text x="202" y="825" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" font-weight="430" fill="#56665F" opacity="1.0"><tspan x="202" dy="0">会不会共享给其他机构或人员？</tspan></text><rect x="112" y="906" width="50" height="50" rx="6" fill="#F5F1E8" stroke="#1E493C" stroke-width="4"/><text x="137" y="943" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="750" fill="#1E493C" opacity="1.0"><tspan x="137" dy="0">4</tspan></text><text x="200" y="940" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="40" font-weight="700" fill="#152B24" opacity="1.0"><tspan x="200" dy="0">怎么处理</tspan></text><text x="202" y="1030" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" font-weight="430" fill="#56665F" opacity="1.0"><tspan x="202" dy="0">以后怎样查询、更正或删除？</tspan></text><rect x="105" y="1192" width="870" height="116" rx="12" fill="#F8E7E3"/><text x="540" y="1250" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" font-weight="550" fill="#152B24" opacity="1.0"><tspan x="540" dy="0">健康资料属于敏感个人信息。这里提供一般核对问题，不展开个案合规</tspan><tspan x="540" dy="35">判断。</tspan></text>
