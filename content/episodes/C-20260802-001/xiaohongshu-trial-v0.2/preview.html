<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小红书图文预览</title><style>
    body{margin:0;padding:28px;background:#e9e6de;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#252821}
    main{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:24px;max-width:1500px;margin:auto}
    figure{margin:0;background:white;padding:10px;box-shadow:0 6px 24px rgba(37,40,33,.12)}img{display:block;width:100%;height:auto}figcaption{padding:8px 2px 0;font-size:13px;color:#6d716a}
    </style></head><body><main><figure><img src="source/01-cover.svg" alt="桌面上摊着暖色资料和深绿笔记本，一只手停在手机付款区域上方，左上覆盖健年健康功课单式封面标题。"><figcaption>01</figcaption></figure>
<figure><img src="source/02-homework-sheet.svg" alt="健年健康功课单，集中列出健康项目付款前需要核对的价值、证据、交付、验收和责任问题。"><figcaption>02</figcaption></figure>
<figure><img src="source/03-send-this.svg" alt="一张可直接复制的话术卡，要求销售说明交付、证据、验收和责任主体。"><figcaption>03</figcaption></figure>
<figure><img src="source/04-promise.svg" alt="问题卡提醒把改善状态拆成具体交付、人员、次数、时长和不能回答的问题。"><figcaption>04</figcaption></figure>
<figure><img src="source/05-evidence.svg" alt="问题卡提醒核对论文研究对象、使用方法、人群和实际结果是否与眼前项目一致。"><figcaption>05</figcaption></figure>
<figure><img src="source/06-acceptance-mismatch.svg" alt="两张对话纸卡表现消费者没有感受与服务方已经完成十二次服务之间的验收错位。"><figcaption>06</figcaption></figure>
<figure><img src="source/07-responsibility.svg" alt="桌面合同和收据场景旁，列出收款、服务、发票、争议和退款责任问题。"><figcaption>07</figcaption></figure>
<figure><img src="source/08-health-data.svg" alt="可收藏清单列出提交体检报告等健康资料前需要询问的用途、保存、共享和处理方式。"><figcaption>08</figcaption></figure>
<figure><img src="source/09-closing.svg" alt="收尾页将主判断、今晚不买的提醒和互动问题分区排版，避免文字与圆形重叠。"><figcaption>09</figcaption></figure></main></body></html>
